[package]
name = "ecsterm"
version = "0.1.1"
edition = "2024"
description = "TUI to browse ECS clusters, services, containers and tasks and run the matching AWS CLI commands"
license = "MIT"
repository = "https://github.com/aronjohanns/ecsterm"
homepage = "https://github.com/aronjohanns/ecsterm"
readme = "README.md"
keywords = ["aws", "ecs", "tui", "cli", "terminal"]
categories = ["command-line-utilities"]
exclude = ["docs/"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
dirs = "7.0.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[features]
# Fake data for screenshots: cargo run --features demo -- --demo
demo = []

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
